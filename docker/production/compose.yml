# ==============================================================================
# SignFlow Production Docker Compose Configuration
# ==============================================================================
# Architecture:
#   Internet -> HTTPS Reverse Proxy (Port 443) -> SignFlow App (:3000)
#   Internal VPC Network:
#     - SignFlow App <-> PostgreSQL (:5432, private)
#     - SignFlow App <-> Redis/BullMQ (:6379, private)
#     - SignFlow App <-> Gotenberg (:3000, private)
#     - SignFlow App -> External S3-compatible Object Storage (Outbound HTTPS)
#     - SignFlow App -> External Transactional Mail Provider (Outbound TLS)
#
# Security Notice:
#   - NO internal ports (PostgreSQL, Redis, Gotenberg) are published to the host.
#   - Inbucket is omitted (replaced by external production email provider).
#   - MinIO is omitted (replaced by managed S3-compatible storage).
#   - All sensitive credentials are provided via environment variables.
# ==============================================================================

name: signflow-production

services:
  # ----------------------------------------------------------------------------
  # 1. SignFlow Application Server (Remix + Hono + Node runtime)
  # ----------------------------------------------------------------------------
  signflow:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: signflow:latest
    container_name: signflow-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    ports:
      # Expose only the application port to the host for reverse-proxy binding
      # Binding to 127.0.0.1 ensures traffic must flow through your reverse proxy
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL:?err}
      - NEXT_PRIVATE_INTERNAL_WEBAPP_URL=${NEXT_PRIVATE_INTERNAL_WEBAPP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SUPPORT_EMAIL=${NEXT_PUBLIC_SUPPORT_EMAIL}

      # Authentication & Secrets
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?err}
      - NEXT_PRIVATE_ENCRYPTION_KEY=${NEXT_PRIVATE_ENCRYPTION_KEY:?err}
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=${NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY:?err}

      # Database Configuration
      - NEXT_PRIVATE_DATABASE_URL=${NEXT_PRIVATE_DATABASE_URL:?err}
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=${NEXT_PRIVATE_DIRECT_DATABASE_URL:-${NEXT_PRIVATE_DATABASE_URL}}

      # Storage Configuration (S3-compatible)
      - NEXT_PUBLIC_UPLOAD_TRANSPORT=${NEXT_PUBLIC_UPLOAD_TRANSPORT:-s3}
      - NEXT_PRIVATE_UPLOAD_BUCKET=${NEXT_PRIVATE_UPLOAD_BUCKET:?err}
      - NEXT_PRIVATE_UPLOAD_REGION=${NEXT_PRIVATE_UPLOAD_REGION:-us-east-1}
      - NEXT_PRIVATE_UPLOAD_ENDPOINT=${NEXT_PRIVATE_UPLOAD_ENDPOINT}
      - NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE=${NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE:-false}
      - NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID=${NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID:?err}
      - NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY=${NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY:?err}
      - NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT=${NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT:-10}

      # Background Jobs (Redis / BullMQ)
      - NEXT_PRIVATE_JOBS_PROVIDER=bullmq
      - NEXT_PRIVATE_REDIS_URL=${NEXT_PRIVATE_REDIS_URL:?err}
      - NEXT_PRIVATE_REDIS_PREFIX=${NEXT_PRIVATE_REDIS_PREFIX:-signflow}
      - NEXT_PRIVATE_BULLMQ_CONCURRENCY=${NEXT_PRIVATE_BULLMQ_CONCURRENCY:-10}

      # Document Conversion (Internal Gotenberg Microservice)
      - NEXT_PRIVATE_DOCUMENT_CONVERSION_URL=http://gotenberg:3000
      - NEXT_PRIVATE_DOCUMENT_CONVERSION_TIMEOUT_MS=${NEXT_PRIVATE_DOCUMENT_CONVERSION_TIMEOUT_MS:-30000}
      - NEXT_PRIVATE_DOCUMENT_CONVERSION_USERNAME=${GOTENBERG_API_BASIC_AUTH_USERNAME:?err}
      - NEXT_PRIVATE_DOCUMENT_CONVERSION_PASSWORD=${GOTENBERG_API_BASIC_AUTH_PASSWORD:?err}

      # Email Configuration
      - NEXT_PRIVATE_SMTP_TRANSPORT=${NEXT_PRIVATE_SMTP_TRANSPORT:-smtp-auth}
      - NEXT_PRIVATE_SMTP_HOST=${NEXT_PRIVATE_SMTP_HOST}
      - NEXT_PRIVATE_SMTP_PORT=${NEXT_PRIVATE_SMTP_PORT:-587}
      - NEXT_PRIVATE_SMTP_USERNAME=${NEXT_PRIVATE_SMTP_USERNAME}
      - NEXT_PRIVATE_SMTP_PASSWORD=${NEXT_PRIVATE_SMTP_PASSWORD}
      - NEXT_PRIVATE_SMTP_APIKEY_USER=${NEXT_PRIVATE_SMTP_APIKEY_USER}
      - NEXT_PRIVATE_SMTP_APIKEY=${NEXT_PRIVATE_SMTP_APIKEY}
      - NEXT_PRIVATE_SMTP_SECURE=${NEXT_PRIVATE_SMTP_SECURE:-false}
      - NEXT_PRIVATE_SMTP_FROM_NAME=${NEXT_PRIVATE_SMTP_FROM_NAME:-SignFlow}
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=${NEXT_PRIVATE_SMTP_FROM_ADDRESS:?err}
      - NEXT_PRIVATE_SMTP_SERVICE=${NEXT_PRIVATE_SMTP_SERVICE}
      - NEXT_PRIVATE_RESEND_API_KEY=${NEXT_PRIVATE_RESEND_API_KEY}

      # Digital Signing Certificate
      - NEXT_PRIVATE_SIGNING_TRANSPORT=${NEXT_PRIVATE_SIGNING_TRANSPORT:-local}
      - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=${NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH:-/opt/signflow/cert.p12}
      - NEXT_PRIVATE_SIGNING_PASSPHRASE=${NEXT_PRIVATE_SIGNING_PASSPHRASE}

      # Telemetry Disabled for SignFlow
      - DOCUMENSO_DISABLE_TELEMETRY=true
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}

      # OAuth Providers (Optional)
      - NEXT_PRIVATE_GOOGLE_CLIENT_ID=${NEXT_PRIVATE_GOOGLE_CLIENT_ID}
      - NEXT_PRIVATE_GOOGLE_CLIENT_SECRET=${NEXT_PRIVATE_GOOGLE_CLIENT_SECRET}
      - NEXT_PRIVATE_MICROSOFT_CLIENT_ID=${NEXT_PRIVATE_MICROSOFT_CLIENT_ID}
      - NEXT_PRIVATE_MICROSOFT_CLIENT_SECRET=${NEXT_PRIVATE_MICROSOFT_CLIENT_SECRET}
      - NEXT_PRIVATE_OIDC_WELL_KNOWN=${NEXT_PRIVATE_OIDC_WELL_KNOWN}
      - NEXT_PRIVATE_OIDC_CLIENT_ID=${NEXT_PRIVATE_OIDC_CLIENT_ID}
      - NEXT_PRIVATE_OIDC_CLIENT_SECRET=${NEXT_PRIVATE_OIDC_CLIENT_SECRET}
      - NEXT_PRIVATE_OIDC_PROVIDER_LABEL=${NEXT_PRIVATE_OIDC_PROVIDER_LABEL:-OIDC}

      # Cloudflare Turnstile (Optional)
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - NEXT_PRIVATE_TURNSTILE_SECRET_KEY=${NEXT_PRIVATE_TURNSTILE_SECRET_KEY}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # Mount the production P12 certificate if local file signing is used
      - ${SIGNING_CERT_HOST_PATH:-/dev/null}:/opt/signflow/cert.p12:ro
    networks:
      - signflow-internal

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL Database (Internal only - No public port)
  # ----------------------------------------------------------------------------
  database:
    image: postgres:15-alpine
    container_name: signflow-database
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - signflow-internal

  # ----------------------------------------------------------------------------
  # 3. Redis / BullMQ Queue (Internal only - No public port)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: signflow-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?err}', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - signflow-internal

  # ----------------------------------------------------------------------------
  # 4. Gotenberg Document Conversion Microservice (Internal only - No public port)
  # ----------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8-libreoffice
    container_name: signflow-gotenberg
    restart: unless-stopped
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: ${GOTENBERG_API_BASIC_AUTH_USERNAME:?err}
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${GOTENBERG_API_BASIC_AUTH_PASSWORD:?err}
    command:
      - gotenberg
      - --api-enable-basic-auth
      - --libreoffice-deny-private-ips
      - --api-timeout=60s
      - --libreoffice-auto-start
      - --libreoffice-start-timeout=120s
      - --pdfengines-disable-routes
      - --webhook-disable
      - --log-level=info
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - signflow-internal

# ------------------------------------------------------------------------------
# Networks & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  signflow-internal:
    driver: bridge

volumes:
  database-data:
  redis-data:
